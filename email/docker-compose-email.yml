name: ${PROJECT_NAME}

services:
  webmail:
    image: ghcr.io/bulwarkmail/webmail:${BULWARK_VERSION}
    container_name: bulwark-container
    restart: unless-stopped
    init: true
    environment:
      TZ: Asia/Krasnoyarsk
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      JMAP_SERVER_URL: ${WEBMAIL_JMAP_URL}
      ALLOW_CUSTOM_JMAP_ENDPOINT: "false"
      STALWART_ADMIN_ACCESS: "off"
      OAUTH_ENABLED: "false"
      LOGIN_SHOW_REMEMBER_ME: "true"
      BULWARK_TELEMETRY: "off"
    extra_hosts:
      - "${MAIL_HOSTNAME}:host-gateway"
    ports:
      - "127.0.0.1:${WEBMAIL_PORT}:3000"
    volumes:
      - webmail:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - network-name

  stalwart:
    image: stalwartlabs/stalwart:${STALWART_VERSION}
    container_name: stalwart-container
    hostname: ${MAIL_HOSTNAME}
    restart: unless-stopped
    init: true
    environment:
      TZ: Asia/Krasnoyarsk
      STALWART_PUBLIC_URL: https://${MAIL_HOSTNAME}
    ports:
      - "25:25"
      - "465:465"
      - "993:993"
      - "4190:4190"
      - "127.0.0.1:${ADMIN_PORT}:443"
      - "127.0.0.1:${SETUP_PORT}:8080"
    volumes:
      - config:/etc/stalwart
      - data:/var/lib/stalwart
    networks:
      - email
      - network-name

  stalwart-antivirus:
    image: clamav/clamav-debian:1.4
    container_name: stalwart-antivirus-container
    restart: unless-stopped
    environment:
      TZ: Asia/Krasnoyarsk
      CLAMAV_NO_MILTERD: "false"
    volumes:
      - clamav:/var/lib/clamav
    networks:
      email:
        aliases:
          - antivirus

volumes:
  webmail:
    name: ${BULWARK_DATA_VOLUME}
  config:
    name: ${STALWART_CONFIG_VOLUME}
  data:
    name: ${STALWART_DATA_VOLUME}
  clamav:
    name: ${CLAMAV_VOLUME}

networks:
  email:
  network-name:
    external: true
    name: ${NETWORK}
