name: ${PROJECT_NAME}

services:
  registry:
    image: registry:2
    container_name: registry-container
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REGISTRY_PORT}:5000"
    volumes:
      - ${VOLUME}:/var/lib/registry
      - ./auth:/auth:ro
    environment:
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_PATH: ${AUTH_PATH}
      REGISTRY_AUTH_HTPASSWD_REALM: ${REGISTRY_AUTH_REALM}
      REGISTRY_STORAGE_DELETE_ENABLED: "${REGISTRY_STORAGE_DELETE_ENABLED}"
    networks:
      - network-name

  a-registry:
    image: joxit/docker-registry-ui:latest
    container_name: a-registry-container
    restart: unless-stopped
    ports:
      - "127.0.0.1:${A_REGISTRY_PORT}:80"
    environment:
      NGINX_PROXY_PASS_URL: http://registry:5000
      REGISTRY_AUTH: "${A_REGISTRY_AUTH}"
      REGISTRY_TITLE: ${A_REGISTRY_TITLE}
      DELETE_IMAGES: "${A_REGISTRY_DELETE_IMAGES}"
    depends_on:
      - registry
    networks:
      - network-name

networks:
  network-name:
    name: ${NETWORK}
    external: true
