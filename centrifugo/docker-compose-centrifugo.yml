name: ${PROJECT_NAME}

services:
  centrifugo:
    image: centrifugo/centrifugo:latest
    container_name: centrifugo-container
    restart: unless-stopped
    command: centrifugo -c config.json
    volumes:
      - ./config.json:/centrifugo/config.json:ro
    environment:
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_HMAC_SECRET_KEY}
      CENTRIFUGO_CLIENT_ALLOWED_ORIGINS: ${CENTRIFUGO_ALLOWED_ORIGINS}
      CENTRIFUGO_ADMIN_ENABLED: "true"
      CENTRIFUGO_ADMIN_PASSWORD: ${CENTRIFUGO_ADMIN_PASSWORD}
      CENTRIFUGO_ADMIN_SECRET: ${CENTRIFUGO_ADMIN_SECRET}
      CENTRIFUGO_HTTP_API_KEY: ${CENTRIFUGO_HTTP_API_KEY}
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    networks:
      - network-name

networks:
  network-name:
    name: ${NETWORK}
    external: true