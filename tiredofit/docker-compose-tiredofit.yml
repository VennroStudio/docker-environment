name: ${PROJECT_NAME}

services:
  tiredofit:
    image: tiredofit/db-backup:latest
    container_name: tiredofit-container
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./backup:/backup
      - ./logs:/logs
    networks:
      - network-name

networks:
  network-name:
    name: ${NETWORK}
    external: true
