name: ${PROJECT_NAME}

services:
  redis:
    image: redis:7-alpine
    container_name: redis-container
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - volume-name:/data
    networks:
      - network-name

  a-redis:
    image: redis/redisinsight:latest
    container_name: a-redis-container
    restart: unless-stopped
    networks:
      - network-name

volumes:
  volume-name:
    name: ${VOLUME}

networks:
  network-name:
    name: ${NETWORK}
    external: true