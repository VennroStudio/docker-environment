name: docker-structure

services:
  portainer:
    container_name: portainer-container
    restart: always
    image: portainer/portainer-ce:latest
    volumes:
      - portainer_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - proxy

volumes:
  portainer_data:

networks:
  proxy:
    external: true