name: ${PROJECT_NAME}

services:
  redis:
    image: redis:7-alpine
    container_name: redis-container
    restart: unless-stopped
    command: redis-server --aclfile /usr/local/etc/redis/users.acl
    volumes:
      - volume-name:/data
      - ./users.acl:/usr/local/etc/redis/users.acl:ro
    networks:
      - network-name

  a-redis:
    image: redis/redisinsight:latest
    container_name: a-redis-container
    restart: unless-stopped
    networks:
      - network-name

volumes:
  volume-name:
    name: ${VOLUME}

networks:
  network-name:
    name: ${NETWORK}
    external: true
