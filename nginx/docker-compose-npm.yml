name: ${PROJECT_NAME}

services:
  npm:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: nginx-container
    restart: unless-stopped
    ports:
      - '80:80'
      - '81:81'
      - '443:443'
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
    networks:
      - network-name

networks:
  network-name:
    name: ${NETWORK}
    external: true