name: ${PROJECT_NAME}

services:
  registry:
    image: registry:2
    container_name: registry-container
    user: "${REGISTRY_UID}:${REGISTRY_GID}"
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REGISTRY_PORT}:5000"
    volumes:
      - ${VOLUME}:/var/lib/registry
      - ./auth:/auth:ro
    environment:
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: ${REGISTRY_AUTH_REALM}
      REGISTRY_STORAGE_DELETE_ENABLED: "${REGISTRY_STORAGE_DELETE_ENABLED}"
    networks:
      - network-name

  a-registry:
    image: ghcr.io/eznix86/docker-registry-ui:latest
    container_name: a-registry-container
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REGISTRY_UI_PORT}:3000"
    environment:
      REGISTRY_URL: http://registry:5000
      REGISTRY_SETTINGS_PUBLIC_HOST: ${REGISTRY_PUBLIC_URL}
      REGISTRY_AUTH: ${REGISTRY_UI_AUTH}
      SERVER_HOST: 0.0.0.0
      DATABASE_URL: /app/data/ui.db
    volumes:
      - registry-ui-data:/app/data
    depends_on:
      - registry
    networks:
      - network-name

volumes:
  registry-ui-data:
    name: ${REGISTRY_UI_VOLUME}

networks:
  network-name:
    name: ${NETWORK}
    external: true
