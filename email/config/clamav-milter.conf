MilterSocket inet:7357
User clamav
ClamdSocket unix:/tmp/clamd.sock

OnClean Accept
OnInfected Reject
OnFail Defer
RejectMsg Rejected by antivirus: %v

# Match clamd's current StreamMaxLength and MaxFileSize (100 MiB).
MaxFileSize 100M
ReadTimeout 120
LogFile /var/log/clamav/milter.log
LogTime yes
LogInfected Basic
