name: ${PROJECT_NAME}

services:
  hysteria:
    image: ${HYSTERIA_IMAGE}
    container_name: ${HYSTERIA_CONTAINER}
    restart: unless-stopped
    command: server -c /etc/hysteria/config.yaml
    volumes:
      - ./config.yaml:/etc/hysteria/config.yaml:ro
      - ${HYSTERIA_CERTS_HOST_PATH}:/etc/hysteria/certs:ro
      - ./acme:/etc/hysteria/acme
    ports:
      - "${HYSTERIA_BIND_IP}:${HYSTERIA_PORT}:${HYSTERIA_PORT}/udp"
    networks:
      - network-name

networks:
  network-name:
    name: ${NETWORK}
    external: true
